<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fathom OG</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&family=Newsreader:opsz,wght@6..72,300..500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #07090E; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #EDF1F7;
    background: radial-gradient(60% 80% at 78% 0%, rgba(127, 240, 230, .18), transparent 70%), linear-gradient(180deg, #0B2026, #091219 55%, #07090E); }
  .sea { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; }
  .sea svg { width: 100%; height: 100%; display: block; }
  .line { position: absolute; left: 1010px; top: 0; height: 452px; width: 2px; background: linear-gradient(rgba(191, 251, 245, 0), rgba(191, 251, 245, .95)); }
  .dot { position: absolute; left: 1002px; top: 444px; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, #fff 0 30%, rgba(98, 230, 220, .9) 45%, rgba(98, 230, 220, 0) 72%); box-shadow: 0 0 40px 10px rgba(98, 230, 220, .35); }
  .ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(159, 245, 236, .7); box-shadow: 0 0 16px rgba(98, 230, 220, .3); }
  .copy { position: absolute; left: 72px; top: 50px; }
  .brand { display: flex; align-items: center; gap: 14px; font: 400 34px/1 'Newsreader', serif; letter-spacing: -.01em; }
  .brand img { width: 52px; height: 52px; }
  h1 { margin: 40px 0 0; font: 400 88px/.95 'Newsreader', serif; font-variation-settings: "opsz" 72; letter-spacing: -.028em; }
  h1 span { display: block; background: linear-gradient(100deg, #A8FFF6, #62E6DC 40%, #5BB4F2); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .eyebrow { margin-top: 30px; font: 500 15px/1 'Geist Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #8F9AAB; display: flex; align-items: center; gap: 12px; }
  .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: #62E6DC; box-shadow: 0 0 12px #62E6DC; }
  .shot { position: absolute; left: 600px; top: 150px; width: 760px; perspective: 1400px; }
  .shot img { width: 100%; border-radius: 12px; transform: rotateY(-16deg) rotateX(6deg); transform-origin: 0 50%;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 40px 90px -20px rgba(0,0,0,.85), 0 0 60px -10px rgba(98,230,220,.45); }
</style>
</head>
<body>
<div class="og">
  <div class="sea" id="sea"></div>
  
  
  
  
  <div class="shot"><img src="/fathom/assets/v6-overview.webp" alt=""></div>
  <div class="copy">
    <div class="brand"><img src="/fathom/assets/icon-512.webp" alt="">Fathom</div>
    <h1>Don't read<br>the diff.<span>Fathom it.</span></h1>
    <div class="eyebrow"><i></i>A Mac app for code agents write</div>
  </div>
</div>
<script>
  const DEPTH = ['#62E6DC', '#5BB4F2', '#7F8CF6', '#A68AF2', '#CB8BDF'];
  const W = 1200, H = 250, ys = [40, 92, 140, 184, 224], amps = [12, 10, 8, 7, 6];
  let defs = '', body = '';
  ys.forEach((y0, i) => {
    let d = '';
    for (let x = 0; x <= W; x += 10) d += (x ? 'L' : 'M') + x + ' ' + (y0 + amps[i] * Math.sin(x / 300 * Math.PI * 2 + i * 1.3 + .4)).toFixed(1);
    defs += `<linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${DEPTH[i]}" stop-opacity=".16"/><stop offset=".7" stop-color="${DEPTH[i]}" stop-opacity=".02"/></linearGradient>`;
    body += `<path d="${d}L${W} ${H}L0 ${H}Z" fill="url(#g${i})"/><path d="${d}" fill="none" stroke="${DEPTH[i]}" stroke-opacity="${.9 - i * .13}" stroke-width="2" filter="url(#b)"/>`;
  });
  document.getElementById('sea').innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs>${defs}<filter id="b" x="-2%" y="-50%" width="104%" height="200%"><feGaussianBlur stdDeviation="3" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${body}</svg>`;
</script>
</body>
</html>
