<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fathom OG</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F3EEE3; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #14130F; font-family: 'Source Serif 4', serif; }
  .mast { position: absolute; left: 60px; right: 60px; top: 34px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; padding-bottom: 12px;
    font-variant-caps: all-small-caps; letter-spacing: .12em; font-size: 16px; color: #47443D; }
  .mast .t { font: 500 30px/1 'Cormorant Garamond', serif; letter-spacing: .14em; font-variant-caps: all-small-caps; color: #14130F; display: flex; align-items: center; gap: 12px; }
  .mast .t img { width: 24px; height: 24px; border-radius: 6px; }
  .mast .r { text-align: right; }
  .double { position: absolute; left: 60px; right: 60px; top: 84px; height: 5px; border-top: 2px solid #14130F; border-bottom: .9px solid #14130F; }
  .kicker { position: absolute; left: 60px; top: 132px; color: #7A1F2B; font-variant-caps: all-small-caps; letter-spacing: .16em; font-size: 17px; }
  h1 { position: absolute; left: 56px; top: 160px; margin: 0; width: 560px; font: 500 96px/.92 'Cormorant Garamond', serif; letter-spacing: -.018em; }
  h1 .l1 { display: block; text-wrap: balance; }
  h1 em { display: block; font-style: italic; color: #7A1F2B; }
  .dek { position: absolute; left: 60px; top: 448px; width: 470px; margin: 0; font: italic 400 22px/1.42 'Source Serif 4', serif; color: #47443D; }
  .plate { position: absolute; left: 640px; top: 150px; width: 500px; padding: 14px; background: #E9E2D3; }
  .plate i { position: absolute; width: 12px; height: 12px; border: 0 solid rgba(20, 19, 15, .4); }
  .plate .a { left: -1px; top: -1px; border-left-width: .9px; border-top-width: .9px; }
  .plate .b { right: -1px; top: -1px; border-right-width: .9px; border-top-width: .9px; }
  .plate .c { left: -1px; bottom: -1px; border-left-width: .9px; border-bottom-width: .9px; }
  .plate .d { right: -1px; bottom: -1px; border-right-width: .9px; border-bottom-width: .9px; }
  .plate img { display: block; width: 100%; border-radius: 4px; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .35), 0 14px 30px -16px rgba(0, 0, 0, .5); }
  .cap { position: absolute; left: 640px; top: 506px; width: 500px; font-size: 16px; color: #47443D; line-height: 1.45; }
  .cap b { font: 500 17px/1 'Cormorant Garamond', serif; font-variant-caps: all-small-caps; letter-spacing: .14em; color: #14130F; margin-right: .5em; }
  .cap b span { color: #7A1F2B; }
</style>
</head>
<body>
<div class="og">
  <div class="mast"><span>Vol. I · No. 5</span><span class="t"><img src="/fathom/assets/icon-512.webp" alt="">The Fathom Review</span><span class="r">Autumn 2026</span></div>
  <div class="double"></div>
  <div class="kicker">Software · Code review in the age of agents</div>
  <h1><span class="l1">Don’t read the diff.</span> <em>Fathom it.</em></h1>
  <p class="dek">A Mac app that reads a pull request and tells it back as a short paper.</p>
  <div class="plate"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><img src="/fathom/assets/v7-overview.webp" alt=""></div>
  <div class="cap"><b>Plate <span>I</span></b>The title page of a reading: an abstract, then the contents.</div>
</div>
</body>
</html>
