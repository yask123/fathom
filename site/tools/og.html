<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fathom OG</title>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F5F2EA; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #16181D; font-family: 'STIX Two Text', serif; font-variant-numeric: oldstyle-nums; }
  .head { position: absolute; left: 64px; right: 64px; top: 40px; display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: .75px solid rgba(22, 24, 29, .2);
    font-size: 17px; font-variant-caps: all-small-caps; letter-spacing: .1em; color: #74716B; }
  .head .brand { display: flex; align-items: center; gap: 10px; color: #16181D; }
  .head img { width: 22px; height: 22px; border-radius: 5px; }
  .copy { position: absolute; left: 64px; top: 128px; width: 470px; }
  h1 { margin: 0; font: 400 66px/1.04 'STIX Two Text', serif; letter-spacing: -.012em; }
  .sub { margin: 24px 0 0; font: italic 400 24px/1.4 'STIX Two Text', serif; color: #41444B; }
  .by { margin: 26px 0 0; font-size: 19px; color: #41444B; }
  .by .sc { font-variant-caps: all-small-caps; letter-spacing: .08em; }
  .plate { position: absolute; left: 584px; top: 120px; width: 560px; padding: 14px; background: #ECE8DE; }
  .plate i { position: absolute; width: 11px; height: 11px; border: 0 solid rgba(22, 24, 29, .38); }
  .plate .a { left: -1px; top: -1px; border-left-width: .9px; border-top-width: .9px; }
  .plate .b { right: -1px; top: -1px; border-right-width: .9px; border-top-width: .9px; }
  .plate .c { left: -1px; bottom: -1px; border-left-width: .9px; border-bottom-width: .9px; }
  .plate .d { right: -1px; bottom: -1px; border-right-width: .9px; border-bottom-width: .9px; }
  .plate img { display: block; width: 100%; border-radius: 4px; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .35), 0 12px 28px -14px rgba(0, 0, 0, .45); }
  .cap { position: absolute; left: 584px; top: 506px; width: 560px; font-size: 17px; color: #41444B; }
  .cap .fig { font-variant-caps: all-small-caps; letter-spacing: .08em; color: #16181D; margin-right: .4em; }
</style>
</head>
<body>
<div class="og">
  <div class="head"><span class="brand"><img src="/fathom/assets/icon-512.webp" alt="">Fathom</span><span>A Mac app for reviewing code that agents write</span></div>
  <div class="copy">
    <h1>Don’t read the diff. Fathom it.</h1>
    <p class="sub">Reading a pull request as a story: what was wrong, the idea that fixes it, how it works now.</p>
    <p class="by"><span class="sc">Free and open source</span> · for macOS</p>
  </div>
  <div class="plate"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><img src="/fathom/assets/v7-overview.webp" alt=""></div>
  <div class="cap"><span class="fig">Fig. 1.</span>The title page of a reading: an abstract, then the contents.</div>
</div>
</body>
</html>
